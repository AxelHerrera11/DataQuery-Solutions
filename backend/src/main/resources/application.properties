# ── Servidor ──────────────────────────────────────────────────────────
server.port=8080
spring.application.name=dataquery-backend

# ── Base de datos del compilador (MariaDB) ────────────────────────────
# MariaDB usa el mismo driver JDBC que MySQL pero con URL mariadb://
# Cambia 'root' y el password según tu instalación local
spring.datasource.url=jdbc:mariadb://localhost:3306/dataquery_compiler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
# (Hibernate lo detecta automáticamente desde MariaDB — no hace falta especificarlo)

# ── Scripts SQL automáticos al arrancar ───────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── CORS ──────────────────────────────────────────────────────────────
dataquery.cors.allowed-origins=http://localhost:5173

# ── Timeouts de conexión (segundos) ───────────────────────────────────
dataquery.connection.timeout=10

# ── Cifrado de contraseñas ────────────────────────────────────────────
# Clave AES de 16 caracteres para cifrar contraseñas de conexiones
# ¡Cambiar en producción!
dataquery.encryption.key=DataQuery2026!Key
