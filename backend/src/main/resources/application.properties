# ── Servidor ──────────────────────────────────────────────────────────
server.port=8080
spring.application.name=dataquery-backend

# ── Base de datos del compilador (MySQL) ──────────────────────────────
# Cambiar estos valores según tu entorno local
spring.datasource.url=jdbc:mysql://localhost:3306/dataquery_compiler?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
# validate  → verifica que las entidades coincidan con la BD (recomendado en producción)
# update    → actualiza el schema si hay cambios menores
# none      → no hace nada (para cuando usamos schema.sql propio)
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL generado por JPA en consola (útil en desarrollo)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Scripts SQL automáticos al arrancar ───────────────────────────────
# Spring Boot ejecuta schema.sql primero, luego data.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Necesario para que JPA y sql.init no entren en conflicto
spring.jpa.defer-datasource-initialization=true

# ── CORS ──────────────────────────────────────────────────────────────
dataquery.cors.allowed-origins=http://localhost:5173

# ── Timeouts de conexión (segundos) ───────────────────────────────────
dataquery.connection.timeout=10
